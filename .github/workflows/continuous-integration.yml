# GitHub Actions Documentation: https://docs.github.com/en/actions

name: "build"

on: ["pull_request", "push"]

jobs:
  code-coverage:
    name: "Code coverage"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v2"
      - name: "Install expect"
        run: |
          sudo apt-get update
          sudo apt-get -y install expect
      - name: "Set up Ruby"
        uses: "actions/setup-ruby@v1"
        with:
          ruby-version: "2.7"
      - name: "Install Ruby dependencies"
        run: |
          gem install bashcov
          gem install codecov
      - name: "Set up PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "latest"
          tools: "composer:v2"
          coverage: "none"
      - name: "Run expect tests"
        run: "bashcov --root ./bin -- ./tests/bash-test.sh tests/tests.sh"
      - name: "Publish coverage report to Codecov"
        uses: "codecov/codecov-action@v1"

  test:
    name: "Expect tests"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        composer-version:
          - "v1"
          - "v2"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v2"
      - name: "Install expect"
        run: |
          sudo apt-get update
          sudo apt-get -y install expect
      - name: "Set up PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "latest"
          tools: "composer:${{ matrix.composer-version }}"
          coverage: "none"
      - name: "Run expect tests"
        run: "composer test"

  static-analysis:
    name: "Static analysis"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v2"
      - name: "Run shellcheck"
        run: "shellcheck --exclude=SC2230 bin/*.sh tests/*.sh"

  run:
    name: "Run action"
    runs-on: "${{ matrix.operating-system }}"
    strategy:
      matrix:
        operating-system:
          - "ubuntu-latest"
          - "windows-latest"
        dependency-versions:
          - "lowest"
          - "highest"
          - "locked"
        composer-version:
          - "v1"
          - "v2"
        composer-options:
          - "--ignore-platform-reqs"
          - ""
        working-directory:
          - "tests/fixtures/with-lock-file"
          - ""
        ignore-cache:
          - "yes"
          - ""
        custom-cache-key:
          - "my-super-custom-cache-key"
          - ""
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v2"
      - name: "Set up PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "latest"
          tools: "composer:${{ matrix.composer-version }}"
          coverage: "none"
      - name: "Run composer-install action"
        uses: ./
        with:
          dependency-versions: "${{ matrix.dependency-versions }}"
          composer-options: "${{ matrix.composer-options }}"
          working-directory: "${{ matrix.working-directory }}"
          ignore-cache: "${{ matrix.ignore-cache }}"
          custom-cache-key: "${{ matrix.custom-cache-key }}"
